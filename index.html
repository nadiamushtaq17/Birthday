<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday My Love ❤️</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<!-- =====================================================
     CURTAINS
===================================================== -->

<div id="curtain">

    <div class="curtain left"></div>

    <div class="curtain right"></div>

</div>



<!-- =====================================================
     FIRST HEART SCREEN
===================================================== -->

<div id="intro">

    <div class="heart-area">

        <div class="heart"></div>

        <div class="heart-text">

            Hi Mr. Husband

            <small>❤️</small>

        </div>

    </div>

</div>



<!-- =====================================================
     BIRTHDAY SCREEN
===================================================== -->

<div id="birthday">


    <!-- LEFT PARTY POPPER -->

    <div class="popper left">

        <div class="popper-body"></div>

    </div>


    <!-- RIGHT PARTY POPPER -->

    <div class="popper right">

        <div class="popper-body"></div>

    </div>


    <!-- SPARKLES -->

    <div
        class="sparkle"
        style="top:15%;left:12%;"
    >
        ✨
    </div>

    <div
        class="sparkle"
        style="top:20%;right:15%;"
    >
        ✨
    </div>

    <div
        class="sparkle"
        style="bottom:25%;left:20%;"
    >
        ✨
    </div>

    <div
        class="sparkle"
        style="bottom:30%;right:20%;"
    >
        ✨
    </div>



    <!-- BIRTHDAY CONTENT -->

    <div class="birthday-content">


        <div class="cute-badge">

            🎈 Today Is Your Special Day 🎈

        </div>


        <h1 class="birthday-title">

            🎂 Happy
            <span>Birthday</span> ❤️

        </h1>


        <div class="subtitle">

            Happy Birthday,
            <span>My Love</span> 👑

        </div>


        <div class="final-message">

            May your day be filled with
            happiness, love, laughter and
            beautiful memories. ❤️

            <br>

            You deserve all the happiness
            in the world. ✨

        </div>


        <button
            class="love-button"
            onclick="showLove()"
        >

            ❤️ One More Surprise

        </button>


        <div id="love">

            💖 I Love You Forever 💖

            <br>

            Happy Birthday My King 👑

        </div>


    </div>


</div>



<script>

/* =====================================================
   PAGE START
===================================================== */

window.onload=function(){

    /*
       Curtains open for 2.5 seconds.
       Then heart appears.
    */

    setTimeout(function(){

        document
            .getElementById("intro")
            .classList.add("show");

    },2500);


    /*
       Heart stays for 1.5 seconds.
       Then 3-second opening animation starts.
    */

    setTimeout(function(){

        startHeartAnimation();

    },4000);

};



/* =====================================================
   HEART OPEN
===================================================== */

function startHeartAnimation(){

    const intro =
        document.getElementById("intro");

    intro.classList.add("opening");


    /*
       Heart opening animation = 3 seconds.
    */

    setTimeout(function(){

        intro.style.display="none";

        const birthday =
            document.getElementById("birthday");

        birthday.classList.add("show");

        createConfetti();

    },3000);

}



/* =====================================================
   PARTY CONFETTI
===================================================== */

function createConfetti(){

    const colors=[
        "#ff416c",
        "#ffd54f",
        "#4dd0e1",
        "#ffffff",
        "#ff9f43",
        "#9c88ff"
    ];


    /*
       Left and right party bursts
    */

    for(let i=0;i<80;i++){

        setTimeout(function(){

            const piece =
                document.createElement("div");

            piece.className="confetti";


            /*
               Start from left or right lower side
            */

            const fromLeft =
                i % 2 === 0;


            if(fromLeft){

                piece.style.left =
                    (5 + Math.random()*15)+"%";

            }else{

                piece.style.left =
                    (80 + Math.random()*15)+"%";

            }


            piece.style.background =
                colors[
                    Math.floor(
                        Math.random()*colors.length
                    )
                ];


            piece.style.setProperty(
                "--x",
                (
                    fromLeft
                    ?
                    150 + Math.random()*500
                    :
                    -(150 + Math.random()*500)
                )+"px"
            );


            piece.style.setProperty(
                "--y",
                -(150 + Math.random()*500)+"px"
            );


            piece.style.setProperty(
                "--r",
                (Math.random()*900-450)+"deg"
            );


            piece.style.animationDelay =
                (Math.random()*.7)+"s";


            piece.style.width =
                (5+Math.random()*8)+"px";


            piece.style.height =
                (10+Math.random()*15)+"px";


            document
                .getElementById("birthday")
                .appendChild(piece);


            setTimeout(function(){

                piece.remove();

            },4000);


        },i*20);

    }

}



/* =====================================================
   LOVE MESSAGE
===================================================== */

function showLove(){

    document
        .getElementById("love")
        .style.display="block";


    createFloatingHearts();

}



/* =====================================================
   FLOATING HEARTS
===================================================== */

function createFloatingHearts(){

    for(let i=0;i<30;i++){

        setTimeout(function(){

            const heart =
                document.createElement("div");

            heart.className=
                "floating-heart";


            heart.innerHTML=
                Math.random()>.5
                ? "❤️"
                : "💕";


            heart.style.left =
                Math.random()*100+"vw";


            heart.style.animationDuration =
                (4+Math.random()*4)+"s";


            heart.style.fontSize =
                (15+Math.random()*25)+"px";


            document.body.appendChild(heart);


            setTimeout(function(){

                heart.remove();

            },8000);


        },i*100);

    }

}

</script>

</body>
</html>
